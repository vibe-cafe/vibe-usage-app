name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-test:
    # GA arm64 image with Swift 6 and the Testing module; pin Xcode to avoid
    # image-default drift. Update runs-on, DEVELOPER_DIR, and AGENTS.md's CI note together.
    runs-on: macos-26
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      # Keep the default shallow checkout without tags: check-version.sh's
      # build-number comparison with the last v* tag is a release guardrail.
      # Between releases main can equal that tag's build number, so fetching
      # tags would fail PRs without a version bump. With no tags, the script
      # skips that comparison and checks version consistency and integer builds.
      - uses: actions/checkout@v7

      - name: Show toolchain versions
        run: |
          xcodebuild -version
          swift --version

      - name: Check versions
        run: ./scripts/check-version.sh

      - name: Test CLI contract gate (offline)
        run: node --test scripts/check-cli.test.mjs

      # The CLI launcher is owned by vibe-usage-windows; this copy must match it
      # byte for byte.
      - name: CLI launcher matches vibe-usage-windows
        env:
          WINDOWS_BOOTSTRAP_REF: main
        run: ./scripts/check-cli-bootstrap.sh --github "$WINDOWS_BOOTSTRAP_REF"

      # The pinned official Node (both checksums, both architectures), signed
      # the way a release signs it but ad hoc, runs the shipped launcher.
      - name: Bundled Node runs the CLI launcher
        run: |
          ./scripts/fetch-node.sh --universal --output "$RUNNER_TEMP/node/node"
          codesign --force --options runtime --entitlements scripts/node.entitlements \
            --sign - "$RUNNER_TEMP/node/node"
          mkdir -p "$RUNNER_TEMP/vu-home"
          HOME="$RUNNER_TEMP/vu-home" VIBE_USAGE_CONFIG_DIR="$RUNNER_TEMP/vu-home" \
            "$RUNNER_TEMP/node/node" VibeUsage/Resources/cli-bootstrap.mjs --version

      - name: Build debug
        run: swift build

      - name: Build release
        run: swift build -c release

      - name: Run tests
        run: swift test
